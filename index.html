<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra-Early Pump Detector</title>
    <style>
        :root {
            --bg-color: #080c14;
            --card-bg: #111827;
            --border-color: #1f293d;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;
            --text-main: #f9fafb;
            --text-sub: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); padding: 16px; max-width: 500px; margin: 0 auto; min-height: 100vh; }
        
        header { border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 16px; }
        header h1 { font-size: 1.15rem; color: #facc15; display: flex; align-items: center; gap: 8px; }
        header p { font-size: 0.75rem; color: var(--text-sub); margin-top: 4px; }

        .grid { display: grid; gap: 12px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .symbol { font-size: 1.1rem; font-weight: bold; }
        .tag-status { background: rgba(245, 158, 11, 0.2); color: var(--accent-amber); border: 1px solid var(--accent-amber); font-size: 0.68rem; padding: 3px 8px; border-radius: 6px; font-weight: bold; }
        
        .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; font-size: 0.8rem; }
        .metrics div span { display: block; color: var(--text-sub); font-size: 0.7rem; }
        
        .btn-trade { display: block; text-align: center; background: #2563eb; color: #fff; text-decoration: none; font-size: 0.8rem; font-weight: bold; padding: 8px; border-radius: 6px; }
        .btn-trade:active { opacity: 0.8; }
        .empty { text-align: center; padding: 30px; color: var(--text-sub); font-size: 0.85rem; line-height: 1.4; }
        .footer { text-align: center; font-size: 0.7rem; color: var(--text-sub); margin-top: 20px; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ ULTRA-EARLY PUMP DETECTOR</h1>
        <p>Deteksi Altcoin di Dasar (+0% s/d +8%) & Tembok Jual Tipis</p>
    </header>

    <main id="signals-container" class="grid">
        <div class="empty">Memuat sinyal pindaian dini...</div>
    </main>

    <div class="footer" id="last-update">Status: Menunggu data...</div>

    <script>
        const REPO_USER = "tryyushiranda-beep";
        const REPO_NAME = "memecoin-whale-radar";
        // Diubah mengarah ke signals.json sesuai Opsi B
        const DATA_URL = `https://raw.githubusercontent.com/${REPO_USER}/${REPO_NAME}/main/signals.json`;

        function formatIDR(num) {
            if (num >= 1000000000) return (num / 1000000000).toFixed(1) + ' M';
            if (num >= 1000000) return (num / 1000000).toFixed(1) + ' Juta';
            return 'Rp ' + num.toLocaleString('id-ID');
        }

        async function fetchSignals() {
            try {
                const res = await fetch(`${DATA_URL}?t=${new Date().getTime()}`);
                if (!res.ok) throw new Error("Gagal mengambil data");
                
                const data = await res.json();
                renderSignals(data.signals);
                document.getElementById('last-update').innerText = `Terakhir Diperbarui: ${data.updated_at}`;
            } catch (err) {
                document.getElementById('signals-container').innerHTML = `<div class="card empty">⚠️ Memuat data gagal. Mencoba menghubungkan kembali...</div>`;
            }
        }

        function renderSignals(signals) {
            const container = document.getElementById('signals-container');

            if (!signals || signals.length === 0) {
                container.innerHTML = `<div class="card empty">Belum ada altcoin dengan tembok jual super tipis dan akumulasi dini saat ini. Radar standby memindai setiap 5 menit.</div>`;
                return;
            }

            container.innerHTML = signals.map(s => `
                <div class="card">
                    <div class="card-header">
                        <span class="symbol">${s.symbol}/IDR</span>
                        <span class="tag-status">${s.status_tag}</span>
                    </div>
                    <div class="metrics">
                        <div><span>Posisi dari Bottom 24h</span><strong style="color: var(--accent-green);">+${s.gain_from_bottom}%</strong></div>
                        <div><span>Beban Tembok Jual Top 5</span><strong style="color: var(--accent-amber);">${formatIDR(s.top_5_sell_idr)}</strong></div>
                        <div><span>Harga Saat Ini</span><strong>Rp ${s.price_idr.toLocaleString('id-ID')}</strong></div>
                        <div><span>Total Haka Terkini</span><strong>${formatIDR(s.recent_buy_idr)}</strong></div>
                    </div>
                    <a href="${s.trade_url}" target="_blank" class="btn-trade">SERBU DI INDODAX ↗</a>
                </div>
            `).join('');
        }

        fetchSignals();
        setInterval(fetchSignals, 5000);
    </script>
</body>
</html>
