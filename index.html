<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indodax Whale Signal Radar</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-green: #22c55e;
            --accent-green-glow: rgba(34, 197, 94, 0.2);
            --accent-blue: #38bdf8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .title-group h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .title-group p {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            background: rgba(34, 197, 94, 0.1);
            color: var(--accent-green);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--accent-green);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .signal-grid {
            display: grid;
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .symbol-badge {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent-blue);
            letter-spacing: 0.5px;
        }

        .potential-tag {
            background-color: var(--accent-green-glow);
            color: var(--accent-green);
            font-weight: 700;
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 8px;
        }

        .metric-item span {
            display: block;
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-bottom: 2px;
        }

        .metric-item strong {
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .action-btn {
            display: block;
            width: 100%;
            text-align: center;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.875rem;
            padding: 10px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background-color: #1d4ed8;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-sub);
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px dashed var(--border-color);
        }

        .last-updated {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-top: 24px;
        }
    </style>
</head>
<body>

    <header>
        <div class="title-group">
            <h1>WHALE RADAR</h1>
            <p>Indodax Spot Scanner</p>
        </div>
        <div class="status-badge">
            <div class="pulse-dot"></div>
            <span id="status-text">MONITORING</span>
        </div>
    </header>

    <main id="signal-container" class="signal-grid">
        <div class="empty-state">
            <p>Memuat data sinyal dari tracker.py...</p>
        </div>
    </main>

    <div class="last-updated" id="last-updated-time">
        Diperbarui: -
    </div>

    <script>
        const SIGNALS_URL = 'signals.json';
        const REFRESH_INTERVAL = 5000; // Auto refresh tiap 5 detik

        function formatIDR(number) {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                maximumFractionDigits: 0
            }).format(number);
        }

        async function fetchSignals() {
            try {
                // Mencegah browser melakukan caching pada file signals.json
                const response = await fetch(`${SIGNALS_URL}?t=${new Date().getTime()}`);
                
                if (!response.ok) {
                    throw new Error('File signals.json belum ditemukan');
                }

                const signals = await response.json();
                renderSignals(signals);
                
                document.getElementById('status-text').innerText = 'LIVE';
                document.getElementById('last-updated-time').innerText = `Terakhir Diperbarui: ${new Date().toLocaleTimeString('id-ID')}`;
            } catch (error) {
                document.getElementById('status-text').innerText = 'OFFLINE';
                const container = document.getElementById('signal-container');
                container.innerHTML = `
                    <div class="empty-state">
                        <p style="color: #ef4444;">⚠️ Menunggu data dari tracker.py...</p>
                        <p style="font-size: 0.75rem; margin-top: 8px;">Pastikan skrip tracker.py sedang berjalan.</p>
                    </div>
                `;
            }
        }

        function renderSignals(signals) {
            const container = document.getElementById('signal-container');

            if (!signals || signals.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p>Belum ada sinyal terdeteksi.</p>
                        <p style="font-size: 0.75rem; margin-top: 4px;">Radar sedang memindai koin dengan Buy Wall & HAKA Whale.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = signals.map(signal => {
                const pairCode = signal.symbol.toLowerCase();
                const tradeUrl = `https://indodax.com/market/${pairCode}idr`;

                return `
                    <div class="card">
                        <div class="card-header">
                            <span class="symbol-badge">${signal.symbol} / IDR</span>
                            <span class="potential-tag">POTENSI ${signal.potential}</span>
                        </div>
                        
                        <div class="metrics-grid">
                            <div class="metric-item">
                                <span>Harga Saat Ini</span>
                                <strong>${formatIDR(signal.price_idr)}</strong>
                            </div>
                            <div class="metric-item">
                                <span>Buy Wall (Penahan)</span>
                                <strong style="color: var(--accent-green);">${formatIDR(signal.buy_wall_idr)}</strong>
                            </div>
                            <div class="metric-item">
                                <span>Aksi HAKA (5m)</span>
                                <strong style="color: var(--accent-blue);">${formatIDR(signal.haka_5m_idr)}</strong>
                            </div>
                            <div class="metric-item">
                                <span>Waktu Sinyal</span>
                                <strong>${signal.timestamp.split(' ')[1]}</strong>
                            </div>
                        </div>

                        <a href="${tradeUrl}" target="_blank" class="action-btn">
                            EKSEKUSI DI INDODAX ↗
                        </a>
                    </div>
                `;
            }).join('');
        }

        // Jalankan pindaian pertama kali dan set interval otomatis
        fetchSignals();
        setInterval(fetchSignals, REFRESH_INTERVAL);
    </script>
</body>
</html>
