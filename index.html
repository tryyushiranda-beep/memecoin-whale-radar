<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC Dip-Buy Whale Radar v2.0</title>
    <style>
        :root {
            --bg-color: #080c14;
            --card-bg: #111827;
            --border-color: #1f293d;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-amber: #f59e0b;
            --text-main: #f9fafb;
            --text-sub: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); padding: 16px; max-width: 500px; margin: 0 auto; min-height: 100vh; }
        
        header { border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 16px; }
        header h1 { font-size: 1.15rem; color: #facc15; display: flex; align-items: center; gap: 8px; }
        header p { font-size: 0.75rem; color: var(--text-sub); margin-top: 4px; }

        .btc-banner { border-radius: 10px; padding: 12px; margin-bottom: 16px; font-size: 0.8rem; }
        .btc-correcting { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--accent-red); }
        .btc-normal { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--accent-green); }

        .grid { display: grid; gap: 12px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .symbol { font-size: 1.1rem; font-weight: bold; }
        .tag-status { background: rgba(245, 158, 11, 0.2); color: var(--accent-amber); border: 1px solid var(--accent-amber); font-size: 0.68rem; padding: 3px 8px; border-radius: 6px; font-weight: bold; }
        
        .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; font-size: 0.8rem; }
        .metrics div span { display: block; color: var(--text-sub); font-size: 0.7rem; }
        
        .btn-trade { display: block; text-align: center; background: #2563eb; color: #fff; text-decoration: none; font-size: 0.8rem; font-weight: bold; padding: 8px; border-radius: 6px; }
        .btn-trade:active { opacity: 0.8; }
        .empty { text-align: center; padding: 30px; color: var(--text-sub); font-size: 0.85rem; line-height: 1.4; }
        .footer { text-align: center; font-size: 0.7rem; color: var(--text-sub); margin-top: 20px; }
    </style>
</head>
<body>

    <header>
        <h1>🐋 REAL WHALE HAKA RADAR</h1>
        <p>Altcoin Diskon Dibeli Paus ≥ Rp 10 Juta Saat BTC Koreksi</p>
    </header>

    <div id="btc-banner" class="btc-banner btc-normal">
        Memuat status pasar BTC...
    </div>

    <main id="signals-container" class="grid">
        <div class="empty">Memuat pindaian eksekusi Paus...</div>
    </main>

    <div class="footer" id="last-update">Status: Menunggu data...</div>

    <script>
        const REPO_USER = "tryyushiranda-beep";
        const REPO_NAME = "memecoin-whale-radar";
        const DATA_URL = `https://raw.githubusercontent.com/${REPO_USER}/${REPO_NAME}/main/decoupling_signals.json`;

        function formatIDR(num) {
            if (num >= 1000000000) return (num / 1000000000).toFixed(1) + ' Miliar';
            if (num >= 1000000) return (num / 1000000).toFixed(1) + ' Juta';
            return 'Rp ' + num.toLocaleString('id-ID');
        }

        async function fetchSignals() {
            try {
                const res = await fetch(`${DATA_URL}?t=${new Date().getTime()}`);
                if (!res.ok) throw new Error("Gagal mengambil data");
                
                const data = await res.json();
                renderBTCStatus(data.btc_status);
                renderSignals(data.signals, data.btc_status.is_correcting);
                document.getElementById('last-update').innerText = `Terakhir Diperbarui: ${data.updated_at}`;
            } catch (err) {
                document.getElementById('btc-banner').innerText = "⚠️ Gagal menghubungkan ke data.";
            }
        }

        function renderBTCStatus(btc) {
            const banner = document.getElementById('btc-banner');
            if (btc.is_correcting) {
                banner.className = "btc-banner btc-correcting";
                banner.innerHTML = `
                    <strong>⚠️ STATUS BTC: SEDANG KOREKSI</strong>
                    <div style="font-size: 0.72rem; margin-top: 4px; color: var(--text-sub);">
                        Radar aktif mencari Altcoin dengan transaksi Haka Paus (≥ Rp 10 Juta).
                    </div>
                `;
            } else {
                banner.className = "btc-banner btc-normal";
                banner.innerHTML = `
                    <strong>✅ STATUS BTC: STABIL / NAIK</strong>
                    <div style="font-size: 0.72rem; margin-top: 4px; color: var(--text-sub);">
                        BTC tidak sedang koreksi. Radar diposisikan *standby*.
                    </div>
                `;
            }
        }

        function renderSignals(signals, isCorrecting) {
            const container = document.getElementById('signals-container');
            
            if (!isCorrecting) {
                container.innerHTML = `<div class="card empty">Radar standby. Sinyal hanya muncul saat BTC sedang koreksi agar entri beli lebih aman.</div>`;
                return;
            }

            if (!signals || signals.length === 0) {
                container.innerHTML = `<div class="card empty">BTC sedang koreksi, namun belum terdeteksi transaksi Haka Paus ≥ Rp 10 Juta di altcoin saat ini.</div>`;
                return;
            }

            container.innerHTML = signals.map(s => `
                <div class="card">
                    <div class="card-header">
                        <span class="symbol">${s.symbol}/IDR</span>
                        <span class="tag-status">${s.status_tag}</span>
                    </div>
                    <div class="metrics">
                        <div><span>Eksekusi Beli Riil</span><strong style="color: var(--accent-green);">${s.real_buy_pct}% Buy</strong></div>
                        <div><span>Diskon dari High 24h</span><strong style="color: var(--accent-amber);">–${s.discount_pct}%</strong></div>
                        <div><span>Harga Saat Ini</span><strong>Rp ${s.price_idr.toLocaleString('id-ID')}</strong></div>
                        <div><span>Total Beli Riil</span><strong>${formatIDR(s.real_buy_volume)}</strong></div>
                    </div>
                    <a href="${s.trade_url}" target="_blank" class="btn-trade">INDODAX ↗</a>
                </div>
            `).join('');
        }

        fetchSignals();
        setInterval(fetchSignals, 10000);
    </script>
</body>
</html>
