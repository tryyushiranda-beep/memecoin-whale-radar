<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indodax Whale Radar (On-Chain)</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-purple: #6366f1;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-amber: #f59e0b;
      --accent-blue: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .btn-notif {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
      margin-bottom: 16px;
    }

    .filter-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }

    .tab {
      padding: 8px 14px;
      border-radius: 20px;
      background-color: var(--card-bg);
      color: var(--text-sub);
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      border: 1px solid #334155;
      cursor: pointer;
    }

    .tab.active {
      background-color: var(--accent-purple);
      color: white;
      border-color: var(--accent-purple);
    }

    .signals-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      border: 1px solid #334155;
      position: relative;
    }

    .card.burst {
      border: 1px solid var(--accent-red);
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.15);
    }

    .card.silent {
      border: 1px solid var(--accent-blue);
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.15);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .wallet-tag {
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .badge-scan {
      background-color: #3b82f620;
      color: #60a5fa;
    }

    .badge-chain {
      background-color: #10b98120;
      color: #34d399;
    }

    .token-info {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .token-details {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 12px;
    }

    .val-highlight {
      color: var(--accent-green);
      font-weight: 700;
    }

    .time-info {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .recommendation-box {
      background-color: #0f172a80;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.78rem;
      line-height: 1.4;
      margin-bottom: 12px;
      border-left: 3px solid var(--accent-green);
    }

    .recommendation-box.burst {
      border-left-color: var(--accent-red);
    }

    .recommendation-box.silent {
      border-left-color: var(--accent-blue);
    }

    .btn-trade {
      display: block;
      width: 100%;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      background-color: var(--accent-purple);
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-sub);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>🚀 Indodax Whale Radar (On-Chain)</h1>
    <button class="btn-notif" onclick="enableAudioNotifications()">🔔 Aktifkan Notifikasi & Suara HP</button>
    
    <div class="filter-tabs">
      <div class="tab active" onclick="filterSignals('ALL')">Semua Sinyal</div>
      <div class="tab" onclick="filterSignals('SILENT')">💎 Silent Accumulation</div>
      <div class="tab" onclick="filterSignals('BURST')">🚨 Whale Burst</div>
    </div>
  </header>

  <main id="signalsContainer" class="signals-container">
    <div class="empty-state">Memuat sinyal real-time...</div>
  </main>

  <script>
    let rawSignalsData = [];
    let currentFilter = 'ALL';
    let previousSignalCount = 0;
    let audioContextAllowed = false;

    function enableAudioNotifications() {
      audioContextAllowed = true;
      alert("✅ Notifikasi & Suara HP berhasil diaktifkan!");
      playBeep();
    }

    function playBeep() {
      if (!audioContextAllowed) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
      } catch (e) {
        console.log("Audio play blocked", e);
      }
    }

    function filterSignals(type) {
      currentFilter = type;
      document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
      event.target.classList.add('active');
      renderSignals();
    }

    function renderSignals() {
      const container = document.getElementById('signalsContainer');
      let filtered = rawSignalsData;

      if (currentFilter !== 'ALL') {
        filtered = rawSignalsData.filter(s => s.signal_type === currentFilter);
      }

      if (!filtered || filtered.length === 0) {
        container.innerHTML = `<div class="empty-state">Belum ada sinyal terdeteksi untuk kategori ini.</div>`;
        return;
      }

      container.innerHTML = filtered.map(sig => {
        const isBurst = sig.signal_type === 'BURST';
        const isSilent = sig.signal_type === 'SILENT';
        const cardClass = isBurst ? 'burst' : (isSilent ? 'silent' : '');
        
        let recText = "<strong>🔥 Sinyal Kuat:</strong> Inflow masif terdeteksi! Siapkan posisi di Indodax.";
        if (isSilent) {
          recText = "<strong>💎 Silent Accumulation:</strong> Volume akumulasi besar tapi harga belum pump. Area entry ideal (diskon)!";
        } else if (isBurst) {
          recText = "<strong>🚨 Whale Burst:</strong> Lompatan volume instan! Momentum cepat, siapkan Stop Loss ketat (3%).";
        }

        return `
          <div class="card ${cardClass}">
            <div class="card-header">
              <div class="wallet-tag">${sig.wallet_name || '🐋 Whale Activity'}</div>
              <div class="badge-group">
                <span class="badge badge-scan">👀 ${sig.count || 1}x Scan</span>
                <span class="badge badge-chain">${sig.chain || 'SOLANA'}</span>
              </div>
            </div>

            <div class="token-info">Memecoin: $${sig.token}</div>
            <div class="token-details">${sig.token_name || ''}</div>
            <div class="token-details">Nilai Beli Whale: <span class="val-highlight">${sig.liquidity || 'Rp 0'}</span></div>
            
            <div class="time-info">⏰ ${sig.timestamp || ''} (Jam UTC)</div>

            <div class="recommendation-box ${cardClass}">
              ${recText}
            </div>

            <a href="${sig.dex_chart}" target="_blank" class="btn-trade">⚡ Trade Cepat di Indodax</a>
          </div>
        `;
      }).join('');
    }

    function loadSignals() {
      // PARAMETER ?t= KUNCI UTAMA ANTI-CACHE (Paksakan browser ambil data terbaru)
      fetch('signals.json?t=' + new Date().getTime())
        .then(response => {
          if (!response.ok) throw new Error("Gagal mengambil data");
          return response.json();
        })
        .then(data => {
          if (Array.isArray(data)) {
            if (data.length > previousSignalCount && previousSignalCount !== 0) {
              playBeep();
            }
            previousSignalCount = data.length;
            rawSignalsData = data;
            renderSignals();
          }
        })
        .catch(err => {
          console.error("Error fetching signals:", err);
        });
    }

    // Auto-refresh data setiap 15 detik di browser
    loadSignals();
    setInterval(loadSignals, 15000);
  </script>
</body>
</html>
