<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indodax Whale Radar (On-Chain)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d0e15;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }
        .header {
            text-align: center;
            padding: 10px 0 15px 0;
        }
        .header h1 {
            font-size: 1.4rem;
            margin: 0;
            color: #ffffff;
        }
        .audio-btn {
            display: block;
            width: 100%;
            max-width: 500px;
            margin: 0 auto 15px auto;
            background-color: #7c3aed;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
        }
        .filter-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            max-width: 500px;
            margin: 0 auto 15px auto;
        }
        .filter-btn {
            background-color: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
        }
        .filter-btn.active {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .card {
            background-color: #171925;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #232738;
            position: relative;
        }
        .chain-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: #059669;
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 5px;
        }
        .wallet-title {
            color: #f472b6;
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }
        .info-row {
            font-size: 0.85rem;
            margin: 4px 0;
            color: #cbd5e1;
        }
        .info-row span {
            color: #ffffff;
            font-weight: bold;
        }
        .val-highlight {
            color: #4ade80 !important;
            font-weight: bold;
        }
        .time-text {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 8px;
        }
        .auto-analysis {
            border-radius: 8px;
            padding: 10px;
            margin-top: 12px;
            font-size: 0.8rem;
        }
        .status-strong {
            background-color: rgba(6, 78, 59, 0.5);
            border: 1px solid #059669;
            color: #a7f3d0;
        }
        .status-medium {
            background-color: rgba(120, 53, 15, 0.5);
            border: 1px solid #d97706;
            color: #fde68a;
        }
        .analysis-title {
            font-weight: bold;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn-trade {
            display: block;
            width: 100%;
            background-color: #6366f1;
            color: white;
            text-align: center;
            padding: 10px 0;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            margin-top: 12px;
        }
        .empty-state {
            text-align: center;
            color: #94a3b8;
            padding: 40px 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🚀 Indodax Whale Radar (On-Chain)</h1>
    </div>

    <button id="enableAudio" class="audio-btn">🔔 Aktifkan Notifikasi & Suara HP</button>

    <div class="filter-container">
        <button class="filter-btn active" onclick="setFilter('ALL', this)">Semua Sinyal</button>
        <button class="filter-btn" onclick="setFilter('HOT', this)">🔥 Super Akumulasi (3x+)</button>
        <button class="filter-btn" onclick="setFilter('SOLANA', this)">Solana</button>
    </div>

    <div class="container" id="signalsContainer">
        <div class="empty-state">Mencari aktivitas transaksi paus di atas Rp 50 Juta...</div>
    </div>

    <script>
        let audioEnabled = false;
        let lastSignalCount = 0;
        let currentFilter = 'ALL';
        let rawSignalsData = [];

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep() {
            if (!audioEnabled) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = "sine";
                osc.frequency.value = 880;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch(e) {}
        }

        document.getElementById('enableAudio').addEventListener('click', () => {
            audioCtx.resume().then(() => {
                audioEnabled = true;
                document.getElementById('enableAudio').innerText = "✅ Notifikasi Suara Aktif";
                document.getElementById('enableAudio').style.backgroundColor = "#059669";
                playBeep();
            });
        });

        function setFilter(type, btn) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderSignals();
        }

        function formatToLocalTime(utcString) {
            try {
                const isoStr = utcString.replace(" UTC", "").replace(" ", "T") + "Z";
                const date = new Date(isoStr);
                if (isNaN(date.getTime())) return utcString;

                return date.toLocaleString('id-ID', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                }).replace(/\./g, ':') + " (Jam HP)";
            } catch (e) {
                return utcString;
            }
        }

        function getAutoAnalysis(liquidityStr) {
            const rawVal = parseInt(liquidityStr.replace(/[^0-9]/g, '')) || 0;

            if (rawVal >= 100000000) {
                return {
                    class: 'status-strong',
                    icon: '🚀',
                    status: 'Sinyal Sangat Kuat (Mega Whale)',
                    advice: 'Inflow raksasa terdeteksi! Siapkan posisi dengan Stop Loss 3% & target Profit (+15% s/d +30%).'
                };
            } else if (rawVal >= 50000000) {
                return {
                    class: 'status-strong',
                    icon: '🔥',
                    status: 'Sinyal Kuat (High Conviction)',
                    advice: 'Akumulasi masif terdeteksi! Cek Order Book Indodax untuk konfirmasi momentum.'
                };
            } else {
                return {
                    class: 'status-medium',
                    icon: '⚡',
                    status: 'Sinyal Sedang (Moderate)',
                    advice: 'Pantau ketat. Jika tembok beli tebal, koin berpotensi naik dalam waktu dekat.'
                };
            }
        }

        function renderSignals() {
            const container = document.getElementById('signalsContainer');
            
            let filtered = rawSignalsData.filter(sig => {
                if (currentFilter === 'HOT') return (sig.count || 1) >= 3;
                if (currentFilter === 'SOLANA') return sig.chain === 'SOLANA';
                return true;
            });

            if (!filtered || filtered.length === 0) {
                container.innerHTML = '<div class="empty-state">Tidak ada sinyal yang sesuai dengan filter ini.</div>';
                return;
            }

            let html = '';
            filtered.forEach(sig => {
                const localTime = formatToLocalTime(sig.timestamp);
                const autoEval = getAutoAnalysis(sig.liquidity);
                const scanCount = sig.count || 1;

                let frequencyBadge = '';
                let accumulationAlert = '';

                if (scanCount >= 3) {
                    frequencyBadge = `<span class="chain-badge" style="background-color: #ef4444; right: 80px;">🔥 ${scanCount}x Scan</span>`;
                    accumulationAlert = `
                        <div style="background-color: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; border-radius: 6px; padding: 6px; margin-top: 8px; color: #fca5a5; font-size: 0.75rem; font-weight: bold;">
                            🚨 AKUMULASI TINGGI! Koin ini sudah terdeteksi ${scanCount}x dalam pindaian berkala.
                        </div>
                    `;
                } else {
                    frequencyBadge = `<span class="chain-badge" style="background-color: #3b82f6; right: 80px;">👀 ${scanCount}x Scan</span>`;
                }

                html += `
                    <div class="card">
                        <span class="chain-badge">${sig.chain}</span>
                        ${frequencyBadge}
                        <div class="wallet-title">${sig.wallet_name}</div>
                        <div class="info-row">Memecoin: <span>$${sig.token}</span></div>
                        <div class="info-row">${sig.token_name}</div>
                        <div class="info-row">Nilai Beli Whale: <span class="val-highlight">${sig.liquidity}</span></div>
                        <div class="time-text">⏰ ${localTime}</div>

                        ${accumulationAlert}

                        <div class="auto-analysis ${autoEval.class}">
                            <div class="analysis-title">${autoEval.icon} ${autoEval.status}</div>
                            <div><b>Rekomendasi:</b> ${autoEval.advice}</div>
                        </div>

                        <a href="${sig.dex_chart}" target="_blank" class="btn-trade">⚡ Trade Cepat di Indodax</a>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        async function loadSignals() {
            try {
                const response = await fetch('signals.json?t=' + new Date().getTime());
                rawSignalsData = await response.json();

                if (rawSignalsData.length > lastSignalCount && lastSignalCount !== 0) {
                    playBeep();
                }
                lastSignalCount = rawSignalsData.length;

                renderSignals();
            } catch (error) {
                console.error("Gagal memuat signals.json:", error);
            }
        }

        loadSignals();
        setInterval(loadSignals, 10000);
    </script>
</body>
</html>
