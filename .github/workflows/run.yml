name: Ultra Early Pump Scanner & Auto Tracker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Scanner Script
        run: python decoupling_scanner.py

      - name: Auto Commit & Push Data
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "auto: update ultra early pump signals and history [skip ci]"
          file_pattern: "signals.json decoupling_signals.json signal_history.json"
