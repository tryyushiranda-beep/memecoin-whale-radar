name: Memecoin Whale Radar

on:
  schedule:
    - cron: '*/15 * * * *' # Berjalan otomatis setiap 15 menit
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Memecoin Tracker Script
        run: python tracker.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add signals.json
          git commit -m "Auto update memecoin signals [skip ci]" || exit 0
          git push
