name: Memecoin Whale Radar

on:
  workflow_dispatch: # Memungkinkan kamu menjalankan manual kapan saja
  schedule:
    - cron: '*/15 * * * *' # Otomatis berjalan setiap 15 menit sekali 24/7

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          
      - name: Run radar tracker
        run: python tracker.py
        
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add signals.json
          git diff-index --quiet HEAD || git commit -m "Auto-update whale signals"
          git push
