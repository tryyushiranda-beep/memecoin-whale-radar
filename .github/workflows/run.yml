name: Ultra Early Pump Scanner

on:
  schedule:
    # Menjalankan alur kerja otomatis setiap 5 menit
    - cron: '*/5 * * * *'
  workflow_dispatch: # Mengizinkan eksekusi manual via tab Actions

# Mencegah eksekusi bersamaan jika job sebelumnya belum selesai
concurrency:
  group: scanner-workflow
  cancel-in-progress: false

# Memberikan izin menulis ke repositori
permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 4 # Batas waktu maksimal 4 menit agar tidak menggantung

    steps:
      # 1. Checkout repositori dengan riwayat penuh
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup environment Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Cache dependencies untuk mempercepat eksekusi
      - name: Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. Install dependencies / ketergantungan
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 5. Jalankan skrip scanner
      - name: Run Scanner Script
        run: |
          python main.py

      # 6. Commit dan Push Data dengan Proteksi Anti-Konflik
      - name: Commit and Push Signals Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Tambahkan semua file perubahan/output data
          git add .
          
          # Cek apakah ada perubahan file
          if ! git diff-index --quiet HEAD; then
            git commit -m "auto: update ultra early pump signals [skip ci]"
            
            SUCCESS=0
            for i in {1..3}; do
              echo "Mencoba push data (Percobaan $i)..."
              
              # Stash, pull rebase, lalu pop agar rebase selalu bersih
              git stash
              git pull origin main --rebase
              git stash pop || true
              git add .
              
              if git push origin main; then
                SUCCESS=1
                break
              fi
              
              echo "Terjadi bentrokan remote, mencoba ulang dalam 3 detik..."
              sleep 3
            done
            
            if [ $SUCCESS -eq 0 ]; then
              echo "Gagal melakukan push setelah 3 kali percobaan."
              exit 1
            fi
          else
            echo "Tidak ada perubahan data baru untuk di-commit."
          fi
