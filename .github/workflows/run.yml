name: Indodax Smart Money Scanner v6

on:
  schedule:
    # Berjalan otomatis setiap 5 menit
    - cron: '*/5 * * * *'
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual dari web GitHub

jobs:
  scan-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Run Tracker v6 Script
        run: python tracker.py

      - name: Commit and Push Updated Signals
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add signals.json
          git commit -m "Auto-update signals.json via Tracker v6 [skip ci]" || exit 0
          git push
