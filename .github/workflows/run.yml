name: Indodax Smart Money Scanner

on:
  schedule:
    - cron: '*/5 * * * *'  # Berjalan otomatis setiap 5 menit
  workflow_dispatch:       # Memungkinkan tombol 'Run workflow' manual

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Run Tracker Script
        run: python tracker.py

      - name: Commit and Push signals.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add signals.json
          git commit -m "auto: update signals.json [skip ci]" || exit 0
          git push
